# Generated by Evolve. Review before merging; the automatic merge policy never merges this file.
name: evolve-ci
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: evolve-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evolve-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: "Enable corepack"
        run: "corepack enable"
      - name: "npm ci"
        run: "npm ci"
      - name: "npm test"
        run: "npm test"
